<body>
<header class="unit-header">
  <div class="unit-brand">
    <div class="unit-mark">Я</div>
    <div>
      <h1>本课全部</h1>
      <p>本课全部内容 · 重音 / 语法 / 中文</p>
    </div>
  </div>
  <div class="unit-controls">
    <a class="unit-btn" id="backLevelLink" href="book.html" title="返回上一级">← 上一级</a>
    <label class="unit-select-label">课程
      <select id="deckSelect"></select>
    </label>
    <input id="filterInput" class="unit-search" type="search" placeholder="筛选俄语 / 中文 / 分类">
    <button type="button" class="unit-btn global-search-toggle" data-global-search aria-pressed="false">全书</button>
    <a class="unit-btn primary" id="startStudy" href="index.html">开始学习</a>
    <button id="printBtn" class="unit-btn" type="button">打印</button>
  </div>
</header>

<main class="unit-main">
  <div class="unit-meta">
    <div>
      <span class="unit-eyebrow" id="deckTag">课程</span>
      <h2 id="deckTitle">加载中…</h2>
    </div>
    <div class="unit-count" id="count"></div>
  </div>
  <div class="unit-grid" id="unitGrid"></div>
  <div class="unit-empty" id="empty" hidden>没有匹配的卡片。</div>
</main>

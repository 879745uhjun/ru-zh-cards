<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>全书搜索 · 俄汉记忆卡</title>
<link rel="stylesheet" href="unit.css">
<link rel="stylesheet" href="search.css">
<link rel="stylesheet" href="sidebar.css">
</head>
<body>
<header class="unit-header">
  <div class="unit-brand">
    <div class="unit-mark">Я</div>
    <div>
      <h1>全书搜索</h1>
      <p>在整本书里查一个词组或句子</p>
    </div>
  </div>
  <div class="unit-controls">
    <a class="unit-btn" href="book.html">← 上一级</a>
    <a class="unit-btn" href="index.html?deck=lesson1">卡片模式</a>
  </div>
</header>

<main class="book-search-main">
  <div class="book-search-hero">
    <span class="unit-eyebrow">SEARCH THE BOOK</span>
    <h2>全书搜索</h2>
    <p>输入俄语或中文，跨 5 个单元查找；点击结果直接跳到对应卡片。</p>
  </div>
  <label class="book-search-input">
    <span aria-hidden="true">⌕</span>
    <input id="bookSearchInput" type="search" placeholder="输入俄语 / 中文 / 分类" autocomplete="off" autofocus>
  </label>
  <div class="book-search-summary" id="bookSearchSummary">输入关键词开始搜索。</div>
  <div class="book-search-results" id="bookSearchResults"></div>
</main>

<script src="data/deck.js"></script>
<script src="data/lesson1.js"></script>
<script src="data/lesson2.js"></script>
<script src="data/lesson3.js"></script>
<script src="data/lesson5.js"></script>
<script src="data/decks-source.js"></script>
<script src="data/sources.js"></script>
<script src="search.js"></script>
<script src="sidebar.js"></script>
</body>
</html>
